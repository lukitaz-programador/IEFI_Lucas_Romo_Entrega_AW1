name: Calidad y despliegue - Chiavetta Detailing

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  calidad:
    name: Verificar proyecto y ejecutar pruebas
    runs-on: ubuntu-latest
    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v6
      - name: Configurar Node.js LTS
        uses: actions/setup-node@v5
        with:
          node-version: '26'
      - name: Verificar sintaxis, referencias y archivos
        run: npm run check
      - name: Ejecutar pruebas unitarias e integración de datos
        run: npm test

  despliegue:
    name: Publicar en GitHub Pages
    if: github.event_name != 'pull_request'
    needs: calidad
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.publicacion.outputs.page_url }}
    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v6
      - name: Configurar GitHub Pages
        uses: actions/configure-pages@v5
      - name: Preparar sitio estático
        uses: actions/upload-pages-artifact@v4
        with:
          path: './site'
      - name: Publicar sitio
        id: publicacion
        uses: actions/deploy-pages@v4
